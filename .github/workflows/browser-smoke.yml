name: Browser user-flow smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.64.1-chromium
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/math-bac-http.log 2>&1 &
          echo $! > /tmp/math-bac-http.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/math-bac-http.log
          exit 1
      - name: Run first-visit guide browser tests
        run: node scripts/first-visit-guide-tests.cjs
      - name: Run student progress regression tests
        run: node scripts/student-progress-tests.cjs
      - name: Run homepage topic rendering performance tests
        run: node scripts/homepage-topic-performance-tests.cjs
      - name: Run homepage topic color contrast tests
        run: node scripts/homepage-topic-contrast-tests.cjs
      - name: Run formula library regression tests
        run: node scripts/formula-library-tests.cjs
      - name: Run solved examples library regression tests
        run: node scripts/solved-examples-tests.cjs
      - name: Run study plan calendar regression tests
        run: node scripts/study-plan-date-tests.cjs
      - name: Run homepage design system regression tests
        run: node scripts/homepage-design-system-tests.cjs
      - name: Audit every homepage shortcut and destination
        run: node scripts/homepage-all-controls-audit-tests.cjs
      - name: Run homepage feedback accessibility tests
        run: node scripts/homepage-feedback-tests.cjs
      - name: Run browser smoke tests
        run: node scripts/browser-user-flow-tests.cjs
      - name: Audit all 14 automated question topics in the browser
        run: node scripts/automated-bank-browser-audit.cjs
      - name: Run accessibility and keyboard navigation tests
        run: node scripts/accessibility-navigation-tests.cjs
      - name: Run responsive mobile layout tests
        run: node scripts/responsive-layout-tests.cjs
      - name: Run homepage small-screen text wrapping tests
        run: node scripts/homepage-small-screen-text-tests.cjs
      - name: Run interactive math assistant tests
        run: node scripts/math-assistant-tests.cjs
      - name: Run math tools interactive browser tests
        run: node scripts/math-tools-interaction-tests.cjs
