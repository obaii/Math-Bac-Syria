name: Validate question bank

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check question-diagrams.js
          node --check enhancements.js
          node --check questions.js
          node --check questions_vectors_additional.js
          node --check questions_typed_additional.js
          node --check merge-questions.js
          node --check solution-guides.js\n          node --check solved-examples.js\n          node --check scripts/solved-examples-tests.cjs
          node --check pwa-install.js
          node --check scripts/validate-question-bank.cjs
          node --check scripts/answer-regression-tests.cjs
          node --check scripts/question-diagram-tests.cjs
          node --check scripts/diagram-reference-coverage-tests.cjs
          node --check scripts/detailed-solution-guides-tests.cjs
          node --check scripts/solution-rendering-safety-tests.cjs
          node --check scripts/student-progress-tests.cjs
          node --check scripts/random-exam-generation-tests.cjs
          node --check scripts/exam-history-archive-tests.cjs
          node --check scripts/exam-config-tests.cjs
          node --check scripts/exam-review-navigation-tests.cjs
          node --check scripts/exam-result-summary-tests.cjs
          node --check scripts/user-flow-smoke-tests.cjs
          node --check scientific-calculator.js
          node --check function-plotter.js
          node --check geometry-tools.js
          node --check formula-library.js
          node --check flashcards.js
          node --check scripts/function-plotter-tests.cjs
          node --check scripts/geometry-tools-tests.cjs
          node --check scripts/formula-library-tests.cjs
          node --check scripts/flashcards-tests.cjs
          node --check scripts/scientific-calculator-tests.cjs
      - name: Check solved examples curriculum coverage and structure\n        run: node scripts/solved-examples-tests.cjs\n      - name: Validate questions and math delimiters
        run: node scripts/validate-question-bank.cjs
      - name: Run verified answer regression checks
        run: node scripts/answer-regression-tests.cjs
      - name: Check supplemental question diagrams
        run: node scripts/question-diagram-tests.cjs
      - name: Check explicitly referenced question diagrams
        run: node scripts/diagram-reference-coverage-tests.cjs
      - name: Check detailed solution guide coverage
        run: node scripts/detailed-solution-guides-tests.cjs
      - name: Check detailed solution HTML safety and math rendering
        run: node scripts/solution-rendering-safety-tests.cjs
      - name: Check student progress tracking
        run: node scripts/student-progress-tests.cjs
      - name: Check random exam generation and balanced selection
        run: node scripts/random-exam-generation-tests.cjs
      - name: Check expandable exam history archive
        run: node scripts/exam-history-archive-tests.cjs
      - name: Check exam difficulty configuration
        run: node scripts/exam-config-tests.cjs
      - name: Check exam review navigation
        run: node scripts/exam-review-navigation-tests.cjs
      - name: Check exam result summary
        run: node scripts/exam-result-summary-tests.cjs
      - name: Check scientific calculator parsing and mathematical functions
        run: node scripts/scientific-calculator-tests.cjs
      - name: Check safe function plotter parsing and math functions
        run: node scripts/function-plotter-tests.cjs
      - name: Check interactive geometry calculations
        run: node scripts/geometry-tools-tests.cjs
      - name: Check interactive flashcard study flow
        run: node scripts/flashcards-tests.cjs
      - name: Check mathematics formula library content
        run: node scripts/formula-library-tests.cjs
      - name: Smoke-test key student user flows
        run: node scripts/user-flow-smoke-tests.cjs
