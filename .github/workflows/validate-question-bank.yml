name: Validate question bank

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check security-utils.js
          node --check scripts/security-utils-tests.cjs
          node --check search-utils.js
          node --check math-format.js
          node --check scripts/math-format-tests.cjs
          node --check app.js
          node --check curriculum-progress.js
          node --check scripts/curriculum-progress-tests.cjs
          node --check question-diagrams.js
          node --check enhancements.js
          node --check questions.js
          node --check questions_vectors_additional.js
          node --check questions_typed_additional.js
          node --check questions_automated_additional.js
          node --check scripts/comprehensive-math-content-audit-tests.cjs
          node --check merge-questions.js
          node --check solution-guides.js
          node --check solved-examples.js
          node --check scripts/solved-examples-tests.cjs
          node --check scripts/limits-sequences-regression-tests.cjs
          node --check scripts/log-exp-integral-regression-tests.cjs
          node --check scripts/curriculum-map-tests.cjs
          node --check scripts/lesson-label-crosswalk-tests.cjs
          node --check scripts/lesson-coverage-audit.cjs
          node --check scripts/lesson-coverage-audit-tests.cjs
          node --check scripts/solved-example-reference-integrity-tests.cjs
          node --check pwa-install.js
          node --check scripts/service-worker-tests.cjs
          node --check scripts/html-anchor-integrity-tests.cjs
          node --check scripts/html-local-asset-integrity-tests.cjs
          node --check scripts/validate-question-bank.cjs
          node --check scripts/answer-regression-tests.cjs
          node --check scripts/solved-examples-2019-audit-tests.cjs
          node --check scripts/question-diagram-tests.cjs
          node --check scripts/diagram-reference-coverage-tests.cjs
          node --check scripts/detailed-solution-guides-tests.cjs
          node --check scripts/solution-rendering-safety-tests.cjs
          node --check scripts/student-progress-tests.cjs
          node --check scripts/random-exam-generation-tests.cjs
          node --check scripts/exam-history-archive-tests.cjs
          node --check scripts/exam-config-tests.cjs
          node --check scripts/exam-review-navigation-tests.cjs
          node --check scripts/exam-result-summary-tests.cjs
          node --check scripts/user-flow-smoke-tests.cjs
          node --check scientific-calculator.js
          node --check function-plotter.js
          node --check geometry-tools.js
          node --check formula-library.js
          node --check flashcards.js
          node --check scripts/function-plotter-tests.cjs
          node --check scripts/geometry-tools-tests.cjs
          node --check scripts/formula-library-tests.cjs
          node --check scripts/flashcards-tests.cjs
          node --check scripts/scientific-calculator-tests.cjs
      - name: Check homepage design system tokens
        run: node scripts/homepage-design-system-tests.cjs
      - name: Check solved examples curriculum coverage and structure
        run: node scripts/solved-examples-tests.cjs
      - name: Verify independently reviewed limits and sequences solutions
        run: node scripts/limits-sequences-regression-tests.cjs
      - name: Verify independently reviewed logarithm, exponential, and integration solutions
        run: node scripts/log-exp-integral-regression-tests.cjs
      - name: Verify the 2019 first-session solved-example audit batch
        run: node scripts/solved-examples-2019-audit-tests.cjs
      - name: Validate per-topic last lesson selection and restoration
        run: node scripts/curriculum-progress-tests.cjs
      - name: Validate complete 63-lesson curriculum inventory
        run: node scripts/curriculum-map-tests.cjs
      - name: Validate provisional solved-example lesson crosswalk
        run: node scripts/lesson-label-crosswalk-tests.cjs
      - name: Audit provisional lesson-by-lesson example distribution
        run: node scripts/lesson-coverage-audit-tests.cjs
      - name: Verify solved-example IDs across library, inventory, and crosswalk
        run: node scripts/solved-example-reference-integrity-tests.cjs
      - name: Check PWA offline asset coverage and service worker hooks
        run: node scripts/service-worker-tests.cjs
      - name: Check HTML id uniqueness and internal anchor targets
        run: node scripts/html-anchor-integrity-tests.cjs
      - name: Check local HTML asset references
        run: node scripts/html-local-asset-integrity-tests.cjs
      - name: Test safe endpoint and external URL validation
        run: node scripts/security-utils-tests.cjs
      - name: Test Arabic-aware search normalization
        run: node scripts/search-utils-tests.cjs
      - name: Validate questions and math delimiters
        run: node scripts/validate-question-bank.cjs
      - name: Test Arabic mathematical notation formatting
        run: node scripts/math-format-tests.cjs
      - name: Audit every question and solved-example math field, fraction, limit arrow, and visual dependency
        run: node scripts/comprehensive-math-content-audit-tests.cjs
      - name: Run verified answer regression checks
        run: node scripts/answer-regression-tests.cjs
      - name: Check supplemental question diagrams
        run: node scripts/question-diagram-tests.cjs
      - name: Check explicitly referenced question diagrams
        run: node scripts/diagram-reference-coverage-tests.cjs
      - name: Check detailed solution guide coverage
        run: node scripts/detailed-solution-guides-tests.cjs
      - name: Check detailed solution HTML safety and math rendering
        run: node scripts/solution-rendering-safety-tests.cjs
      - name: Check student progress tracking
        run: node scripts/student-progress-tests.cjs
      - name: Check random exam generation and balanced selection
        run: node scripts/random-exam-generation-tests.cjs
      - name: Check expandable exam history archive
        run: node scripts/exam-history-archive-tests.cjs
      - name: Check exam difficulty configuration
        run: node scripts/exam-config-tests.cjs
      - name: Check exam review navigation
        run: node scripts/exam-review-navigation-tests.cjs
      - name: Check exam result summary
        run: node scripts/exam-result-summary-tests.cjs
      - name: Check scientific calculator parsing and mathematical functions
        run: node scripts/scientific-calculator-tests.cjs
      - name: Check safe function plotter parsing and math functions
        run: node scripts/function-plotter-tests.cjs
      - name: Check interactive geometry calculations
        run: node scripts/geometry-tools-tests.cjs
      - name: Check interactive flashcard study flow
        run: node scripts/flashcards-tests.cjs
      - name: Check mathematics formula library content
        run: node scripts/formula-library-tests.cjs
      - name: Smoke-test key student user flows
        run: node scripts/user-flow-smoke-tests.cjs
